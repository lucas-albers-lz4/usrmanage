# Optional Tier-2: warn on new vulnerable dependencies in PRs.
# Place at .github/workflows/dependency-review.yml
# Requires GitHub Dependency graph (usually on with Dependabot).

name: Dependency Review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
