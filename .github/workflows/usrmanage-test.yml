name: usrmanage-test

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  host-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Host smoke (shellcheck, layout, validators, mutators, theme, i18n)
        run: ./scripts/smoke-host.sh

  z3-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Z3
        run: sudo apt-get update && sudo apt-get install -y python3-z3

      - name: Z3 sanitation suite (--full)
        run: python3 scripts/z3-verify.py --full
