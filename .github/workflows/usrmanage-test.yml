name: usrmanage-test

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  host-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Host smoke (shellcheck, layout, validators, mutators, theme, i18n)
        run: ./scripts/smoke-host.sh

  z3-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Z3
        run: sudo apt-get update && sudo apt-get install -y python3-z3

      - name: Z3 sanitation suite (--full)
        run: python3 scripts/z3-verify.py --full

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Lint workflows with a pinned actionlint image (docker run steps,
      # NOT a job-level container): a job-level container makes
      # actions/checkout fail with EACCES on the runner's save_state
      # file (seen on PRs #81-#84). The digest pins 1.7.7.
      - name: Verify actionlint version (pinned image)
        run: docker run --rm rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -version

      - name: Run actionlint on workflows
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 -color

  zizmor:
    runs-on: ubuntu-latest
    env:
      # Digest pins ghcr.io/zizmorcore/zizmor:1.29.0 (multi-arch index).
      ZIZMOR_IMAGE: ghcr.io/zizmorcore/zizmor@sha256:863026d54f91271b10b60b67ad8054cb37120167e162482597db102b3026a284
      ZIZMOR_VERSION: "1.29.0"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Static-analysis for Actions (pinned image via docker run, not a
      # job-level container — same EACCES rationale as actionlint above).
      - name: Verify zizmor version (pinned image)
        run: |
          out="$(docker run --rm "$ZIZMOR_IMAGE" --version)"
          printf '%s\n' "$out"
          expected="zizmor ${ZIZMOR_VERSION}"
          if [[ "$out" != "$expected" ]]; then
            echo "expected '${expected}', got '${out}'" >&2
            exit 1
          fi

      - name: Run zizmor on workflows
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            -w /repo \
            "$ZIZMOR_IMAGE" \
            --offline --persona=regular --min-severity=high .
